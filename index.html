<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpicGames 2.0 Editor</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #202025;
            font-family: Arial, sans-serif;
        }

        #editor {
            width: 100%;
            height: 100%;
        }

        #toolbar {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;

            display: flex;
            gap: 8px;

            padding: 10px;

            background: rgba(20, 20, 25, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
        }

        button {
            padding: 8px 14px;

            background: #303038;
            color: white;

            border: 1px solid #555;
            border-radius: 5px;

            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #454550;
        }

        #info {
            position: absolute;
            bottom: 15px;
            left: 15px;

            z-index: 10;

            padding: 10px 14px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div id="editor"></div>

<div id="toolbar">
    <button id="moveButton">Move (W)</button>
    <button id="rotateButton">Rotate (E)</button>
    <button id="scaleButton">Scale (R)</button>
</div>

<div id="info">
    Drag to orbit camera • Scroll to zoom • Use gizmo to edit cube
</div>


<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

import { TransformControls } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/TransformControls.js';


// =====================================================
// SCENE
// =====================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x202025);


// =====================================================
// CAMERA
// =====================================================

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(6, 4, 7);


// =====================================================
// RENDERER
// =====================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;


// Put renderer on the page
document
    .getElementById("editor")
    .appendChild(renderer.domElement);


// =====================================================
// CAMERA CONTROLS
// =====================================================

const orbitControls = new OrbitControls(
    camera,
    renderer.domElement
);

orbitControls.enableDamping = true;

orbitControls.dampingFactor = 0.08;

orbitControls.target.set(
    0,
    1,
    0
);


// =====================================================
// LIGHTING
// =====================================================

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        1
    );

scene.add(ambientLight);


const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

directionalLight.position.set(
    5,
    10,
    5
);

directionalLight.castShadow = true;

scene.add(directionalLight);


// =====================================================
// CUBE
// =====================================================

const cubeGeometry =
    new THREE.BoxGeometry(
        2,
        2,
        2
    );


const cubeMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4488ff
    });


const cube =
    new THREE.Mesh(
        cubeGeometry,
        cubeMaterial
    );


cube.position.set(
    0,
    1,
    0
);

cube.castShadow = true;

cube.receiveShadow = true;

scene.add(cube);


// =====================================================
// GROUND
// =====================================================

const groundGeometry =
    new THREE.PlaneGeometry(
        30,
        30
    );


const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x444444
    });


const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );


ground.rotation.x =
    -Math.PI / 2;


ground.receiveShadow = true;

scene.add(ground);


// =====================================================
// GRID
// =====================================================

const grid =
    new THREE.GridHelper(
        30,
        30
    );

scene.add(grid);


// =====================================================
// TRANSFORM CONTROLS
// =====================================================

const transformControls =
    new TransformControls(
        camera,
        renderer.domElement
    );


transformControls.attach(cube);

scene.add(transformControls);


// =====================================================
// STOP CAMERA WHILE USING GIZMO
// =====================================================

transformControls.addEventListener(
    'dragging-changed',
    function (event) {

        orbitControls.enabled =
            !event.value;

    }
);


// =====================================================
// TOOLBAR
// =====================================================

const moveButton =
    document.getElementById(
        "moveButton"
    );

const rotateButton =
    document.getElementById(
        "rotateButton"
    );

const scaleButton =
    document.getElementById(
        "scaleButton"
    );


moveButton.addEventListener(
    "click",
    () => {

        transformControls.setMode(
            "translate"
        );

    }
);


rotateButton.addEventListener(
    "click",
    () => {

        transformControls.setMode(
            "rotate"
        );

    }
);


scaleButton.addEventListener(
    "click",
    () => {

        transformControls.setMode(
            "scale"
        );

    }
);


// =====================================================
// KEYBOARD SHORTCUTS
// =====================================================

window.addEventListener(
    "keydown",
    (event) => {

        // Don't trigger shortcuts while typing
        if (
            event.target.tagName ===
            "INPUT"
        ) {
            return;
        }


        if (event.key === "w") {

            transformControls.setMode(
                "translate"
            );

        }


        if (event.key === "e") {

            transformControls.setMode(
                "rotate"
            );

        }


        if (event.key === "r") {

            transformControls.setMode(
                "scale"
            );

        }

    }
);


// =====================================================
// ANIMATION LOOP
// =====================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    orbitControls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();


// =====================================================
// WINDOW RESIZE
// =====================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
